<!DOCTYPE html>
<html>
<head>
    <title>Sky Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="bg-dark text-white p-3" style="width: 220px; height: 100vh;">
        <h4 class="mb-4">Sky</h4>

        <ul class="nav flex-column">
            <li class="nav-item mb-2">
                <a class="nav-link text-white" href="#">Dashboard</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white" href="#">Teams</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white" href="#">Organisation</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white" href="#">Messages</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white" href="#">Schedule</a>
            </li>

            <!-- YOUR FEATURE -->
            <li class="nav-item mt-3">
                <a class="nav-link text-warning" href="/reports/">Reports</a>
            </li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1">

        <!-- TOP BAR -->
        <div class="bg-light p-3 border-bottom d-flex justify-content-between">
            <input type="text" class="form-control w-50" placeholder="Search teams, departments or managers...">

            <div>
                <span class="me-3">🔔</span>
                <span>👤</span>
            </div>
        </div>

        <!-- PAGE CONTENT -->
        <div class="p-4">
            {% block content %}
            {% endblock %}
        </div>

    </div>

</div>

</body>
</html>
