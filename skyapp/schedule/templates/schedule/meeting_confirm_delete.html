{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'global/css/base.css' %}">
<link rel="stylesheet" href="{% static 'global/css/forms.css' %}">
<link rel="stylesheet" href="{% static 'global/css/dashboard.css' %}">
{% endblock %}

{% block content %}
<h2>Delete Meeting</h2>

<p>Are you sure you want to delete "{{ meeting.title }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{% url 'schedule' %}">Cancel</a>
</form>
{% endblock %}
