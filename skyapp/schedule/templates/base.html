<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seity Group Project</title>

    {% load static %}

    <!-- Bootstrap CDN -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Seity Project</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/schedule/">Schedule</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/schedule/weekly/">Weekly View</a>
                </li>
                <li class="nav-item">
                   <a class="nav-link" href="/schedule/monthly/">Monthly View</a>
                </li>
                <li class="nav-item">
                   <a class="nav-link" href="/schedule/upcoming/">Upcoming</a>
                </li>

            </ul>

            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <span class="navbar-text me-3">
                            Logged in as {{ user.username }}
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light" href="/accounts/logout/">Logout</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="btn btn-outline-light" href="/accounts/login/">Login</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
