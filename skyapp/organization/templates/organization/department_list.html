{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Departments</h1>

<form method="GET">
    <input type="text" name="q" placeholder="Search..." value="{{ query }}">
    <button type="submit">Search</button>
</form>

<ul>
    {% for dept in departments %}
        <li>
            <a href="{% url 'department_detail' dept.id %}">
                {{ dept.name }}
            </a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
