{% extends "base.html" %}
{% load static %}

{% block title %}New Message - Sky Engineering Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 fw-bold text-light">Messages</h1>
</div>

<ul class="nav nav-tabs mb-4">
    <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'inbox' or request.resolver_match.url_name == 'messages' %}active{% endif %}" href="{% url 'inbox' %}">Inbox</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'sent_messages' %}active{% endif %}" href="{% url 'sent_messages' %}">Sent</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'drafts' %}active{% endif %}" href="{% url 'drafts' %}">Drafts</a>
    </li>
    <li class="nav-item ms-auto">
        <a class="btn btn-primary" href="{% url 'new_message' %}"><i class="bi bi-pencil-square me-2"></i>New Message</a>
    </li>
</ul>

<div class="card detail-card p-4 bg-dark text-light border-secondary">
    <h4 class="mb-4">Send New Message</h4>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" name="send" class="btn btn-success"><i class="bi bi-send me-2"></i>Send Message</button>
            <button type="submit" name="draft" class="btn btn-outline-light">Save as Draft</button>
        </div>
    </form>
</div>
{% endblock %}
