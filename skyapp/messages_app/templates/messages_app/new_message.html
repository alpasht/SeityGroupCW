{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>New Message</title>
    <link rel="stylesheet" href="{% static 'messages_app/teams.css' %}">
</head>
<body>

<div class="sidebar">
    <h2>Sky Portal</h2>
    <a href="/messages/new/">New Message</a>
    <a href="/messages/inbox/">Inbox</a>
    <a href="/messages/sent/">Sent</a>
    <a href="/messages/drafts/">Drafts</a>
</div>

<div class="page">
    <h1>Send New Message</h1>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" name="send">Send Message</button>
            <button type="submit" name="draft">Save as Draft</button>
        </form>
    </div>
</div>

</body>
</html>
