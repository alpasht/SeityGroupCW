<!DOCTYPE html>
<html>

<head>
    <title>Sky Project</title>

    {% load static %}

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/nav_sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'css/teams.css' %}">
</head>

<body>

<div class="d-flex">

    
    <nav class="navbar navbar-expand-lg sky-navbar fixed-top w-100">
        <div class="container-fluid">

            
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                <span class="sky-logo">sky</span>
            </a>

            
            <form class="d-flex mx-auto" style="width: 480px;">
                <input type="text" class="form-control" placeholder="Search teams, departments or managers...">
            </form>

            
            <div class="d-flex align-items-center gap-3">

                <!-- notis -->
                <span class="text-white">🔔</span>

                <!-- the user -->
                <span class="text-white">
                    {% if request.user.is_authenticated %}
                        {{ request.user.username }}
                    {% else %}
                        Guest
                    {% endif %}
                </span>

            </div>
        </div>
    </nav>

    <!-- sidebar -->
    <div class="sidebar mt-5">
        <ul class="nav flex-column p-3">

            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
                   href="{% url 'dashboard' %}">
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'teams' %}active{% endif %}"
                   href="{% url 'teams' %}">
                    Teams
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'organisation' %}active{% endif %}"
                   href="{% url 'organisation' %}">
                    Organisation
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'messages' %}active{% endif %}"
                   href="{% url 'messages' %}">
                    Messages
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'schedule' %}active{% endif %}"
                   href="{% url 'schedule' %}">
                    Schedule
                </a>
            </li>

            
            <li class="nav-item mt-3">
                <a class="nav-link text-warning {% if request.resolver_match.url_name == 'reports_home' %}active{% endif %}"
                   href="{% url 'reports_home' %}">
                    Reports
                </a>
            </li>

        </ul>
    </div>

    
    <div class="flex-grow-1 mt-5 p-4">

        {% block content %}
        {% endblock %}

    </div>

</div>

</body>
</html>
