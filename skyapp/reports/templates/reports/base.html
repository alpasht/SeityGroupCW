<!DOCTYPE html>
<html>

<head>
    <title>Sky Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="d-flex">

        <nav class="navbar navbar-expand-lg sky-navbar fixed-top">
            <div class="container-fluid">
                <!-- Sky Logo -->
                <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                    <span class="sky-logo">sky</span>
                </a>

                <!-- Global Search -->
                <form class="d-flex mx-auto" style="width: 480px;" onsubmit="handleSearch(event)">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input id="globalSearch" type="text" class="form-control search-input border-0 shadow-sm"
                            placeholder="Search teams, departments or managers ...." aria-label="Search">
                    </div>
                </form>

                <!-- Right side icons -->
                <div class="d-flex align-items-center gap-3">
                    <!-- Notifications -->
                    <button class="btn position-relative text-white" onclick="toggleNotifications()">
                        <i class="bi bi-bell fs-4"></i>
                        <span
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
                    </button>

                    <!-- User avatar -->
                    <div class="dropdown">
                        <a class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" href="#"
                            role="button" data-bs-toggle="dropdown">
                            <img src="https://i.pravatar.cc/32?u=student1" alt="User" class="rounded-circle me-2"
                                width="32" height="32">
                            <span class="d-none d-md-inline">Alex Rivera</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="#">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="p-3 mt-5">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %} d-flex align-items-center"
                            href="{% url 'dashboard' %}">
                            <i class="bi bi-grid-3x3-gap-fill me-3"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'teams' or request.resolver_match.url_name == 'team_detail' %}active{% endif %} d-flex align-items-center"
                            href="{% url 'teams' %}">
                            <i class="bi bi-people-fill me-3"></i> Teams
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'organisation' %}active{% endif %} d-flex align-items-center"
                            href="{% url 'organisation' %}">
                            <i class="bi bi-diagram-3 me-3"></i> Organisation
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'messages' %}active{% endif %} d-flex align-items-center"
                            href="{% url 'messages' %}">
                            <i class="bi bi-envelope me-3"></i> Messages
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'schedule' %}active{% endif %} d-flex align-items-center"
                            href="{% url 'schedule' %}">
                            <i class="bi bi-calendar3 me-3"></i> Schedule
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'reports_home' %}active{% endif %} d-flex align-items-center text-warning"
                            href="{% url 'reports_home' %}">
                            <i class="bi bi-file-earmark-bar-graph me-3"></i> Reports
                        </a>
                    </li>
                </ul>
            </div>
        </div>


        <!-- REPORTS FEATURE -->
        <li class="nav-item mt-3">
            <a class="nav-link text-warning" href="/reports/">Reports</a>
        </li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1">


        <!-- PAGE CONTENT -->
        <div class="p-4">
            {% block content %}
            {% endblock %}
        </div>

    </div>

    </div>

</body>

</html>
